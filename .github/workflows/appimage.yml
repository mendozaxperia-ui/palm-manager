name: Experimental AppImage

on:
  push:
    branches: [experimental/appimage]
    paths:
      - "palm_manager.py"
      - "bridge.py"
      - "packaging/**"
      - ".github/workflows/appimage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-dev python3-dbus python3-gi \
            build-essential autoconf automake libtool pkg-config gettext \
            libusb-dev libpng-dev libreadline-dev libpopt-dev \
            docbook-xsl xsltproc bison flex socat \
            libglib2.0-dev libgirepository1.0-dev \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libgl1 libopengl0 librsvg2-bin
          python3 -m pip install --user 'pyinstaller>=6,<7' 'PyQt6>=6.5,<6.9'
      - name: Build and smoke-test AppImage
        run: bash packaging/build-appimage.sh
      - name: Upload AppImage and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Palm-Manager-AppImage-experimental-x86_64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
